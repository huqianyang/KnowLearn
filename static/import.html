<!doctype html>
<!-- 导入页：上传资料（左）、当前任务进度（右）、导入记录（下）。交互设计第 2 章 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>导入资料 · KnowLearn</title>
<link rel="stylesheet" href="/css/app.css">
<style>
  /* 页面布局：左侧固定 420px 上传表单，右侧进度；窄屏改为单列 */
  .page { max-width: 1200px; margin: 24px auto; padding: 0 24px; display: grid; grid-template-columns: 420px 1fr; gap: 20px; align-items: start; }
  .full { grid-column: 1 / -1; }
  @media (max-width: 900px) { .page { grid-template-columns: 1fr; } }
  /* 上传区：拖拽悬停时高亮 */
  .drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 28px 16px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop:hover, .drop.drag { border-color: var(--primary); background: var(--primary-soft); }
  .drop .big { font-size: 28px; }
  .file-chosen { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .file-chosen .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 资料类型单选卡片 */
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-opt { border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
  .type-opt input { margin-right: 6px; }
  .type-opt.sel { border-color: var(--primary); background: var(--primary-soft); }
  .type-opt small { display: block; color: var(--muted); margin-left: 20px; }
  .overwrite { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 16px; }

  /* 任务进度：步骤列表，图标颜色表示状态 */
  .task-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .task-head .fname { font-weight: 600; font-size: 15px; word-break: break-all; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .step { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
  .step:first-child { border-top: none; }
  .icon { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff; background: #cbd2dc; }
  .icon.done { background: var(--ok); }
  .icon.running { background: var(--primary); animation: pulse 1.2s infinite; }
  .icon.failed { background: var(--err); }
  .icon.skipped { background: #e5e7eb; color: var(--muted); }
  @keyframes pulse { 50% { opacity: .45; } }
  .step .sub { font-size: 12px; color: var(--muted); }
  .bar { height: 6px; background: #eef1f5; border-radius: 3px; margin-top: 6px; overflow: hidden; width: 260px; max-width: 100%; }
  .bar i { display: block; height: 100%; background: var(--primary); transition: width .3s; }
  .step .err { color: var(--err); font-size: 12px; margin-top: 4px; word-break: break-all; }
  .dur { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .result { margin-top: 12px; padding: 10px 12px; border-radius: 8px; }
  .result.ok { background: var(--ok-soft); color: var(--ok); }
  .result.fail { background: var(--err-soft); color: var(--err); word-break: break-all; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }

  /* 导入记录表格、筛选、分页 */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; background: #fafbfc; }
  td.fn { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.clickable:hover td { background: #f8fafc; cursor: pointer; }
  tr.on td { background: var(--primary-soft); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .toolbar h2 { margin: 0; }
  .filters { display: flex; gap: 6px; }
  .filters button.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .pager { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; align-items: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">Know<span>Learn</span> 智能教育知识库</div>
  <nav class="nav"><a href="/import.html" class="active">导入资料</a><a href="/chat.html">智能问答</a></nav>
  <div class="spacer"></div>
  <div class="health" id="health"><i class="dot"></i>检查中…</div>
</header>

<main class="page">
  <!-- 上传表单 -->
  <section class="card">
    <h2>上传资料</h2>
    <div class="field">
      <label class="title">文件<span class="req">*</span></label>
      <input type="file" id="fileInput" hidden>
      <!-- 未选文件时显示上传区，选中后显示文件信息 -->
      <div class="drop" id="drop">
        <div class="big">⬆</div>
        <div>点击选择或拖拽文件到这里</div>
        <div class="hint" id="formatHint"></div>
      </div>
      <div class="file-chosen" id="chosen" hidden>
        <span>📄</span><span class="name" id="chosenName"></span>
        <span class="muted" id="chosenSize"></span>
        <button class="btn-text" id="clearFile" title="移除">✕</button>
      </div>
      <div class="error-text" id="fileErr" hidden></div>
    </div>

    <div class="field">
      <label class="title">资料类型<span class="req">*</span></label>
      <div class="types" id="types">
        <label class="type-opt"><input type="radio" name="t" value="course_catalog">课程目录<small>按课程系列解析</small></label>
        <label class="type-opt"><input type="radio" name="t" value="question_bank">题库<small>按题目解析，需先导入课程目录</small></label>
        <label class="type-opt sel"><input type="radio" name="t" value="lecture" checked>课程讲义<small>需填写课程名</small></label>
        <label class="type-opt"><input type="radio" name="t" value="project_doc">项目文档<small>需填写项目名</small></label>
      </div>
    </div>

    <!-- 课程名 / 项目名：只有讲义和项目文档需要 -->
    <div class="field" id="nameField">
      <label class="title"><span id="nameLabel">课程名</span><span class="req">*</span></label>
      <input class="input" id="nameInput" placeholder="选择文件后自动填入，可修改" maxlength="100">
      <div class="hint">已根据文件名自动填写，请核对</div>
      <div class="error-text" id="nameErr" hidden></div>
    </div>

    <div class="overwrite" id="overwrite" hidden>⚠ 该文件之前已导入过，提交后将<b>覆盖</b>旧数据。新数据导入成功前，问答仍使用旧数据。</div>
    <button class="btn btn-primary" id="submit" style="width:100%" disabled>开始导入</button>
  </section>

  <!-- 当前任务进度 -->
  <section class="card">
    <h2>导入进度</h2>
    <div class="empty" id="taskEmpty">提交后在这里查看导入进度<br><small>也可以点击下方导入记录查看详情</small></div>
    <div id="taskBody" hidden>
      <div class="task-head"><span class="fname" id="tName"></span><span class="tag" id="tStatus"></span></div>
      <div class="meta" id="tMeta"></div>
      <ul class="steps" id="steps"></ul>
      <div id="tResult"></div>
    </div>
  </section>

  <!-- 导入记录 -->
  <section class="card full">
    <div class="toolbar">
      <h2>导入记录</h2>
      <!-- data-f 为传给接口的 status 参数 -->
      <div class="filters" id="filters">
        <button class="btn on" data-f="">全部</button>
        <button class="btn" data-f="pending,running">进行中</button>
        <button class="btn" data-f="succeeded">成功</button>
        <button class="btn" data-f="failed">失败</button>
      </div>
    </div>
    <table>
      <thead><tr><th>文件名</th><th>资料类型</th><th>课程 / 项目</th><th>状态</th><th>切片数</th><th>提交时间</th><th>耗时</th></tr></thead>
      <tbody id="historyItems"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody>
    </table>
    <div class="pager"><span id="pageInfo"></span><button class="btn" id="prev">上一页</button><button class="btn" id="next">下一页</button></div>
  </section>
</main>

<script src="/js/common.js"></script>
<script>
const $ = id => document.getElementById(id);
// 显示用的名称与样式映射
const TYPE_NAME = { course_catalog: '课程目录', question_bank: '题库', lecture: '课程讲义', project_doc: '项目文档' };
// 各资料类型允许的格式（与后端 ALLOWED_EXT 一致，前端先校验一次，减少无效上传）
const ALLOWED = { course_catalog: ['.md'], question_bank: ['.md'], lecture: ['.md', '.docx', '.pdf', '.zip'], project_doc: ['.md', '.docx', '.pdf', '.zip'] };
const STATUS = { pending: ['排队中', 'wait'], running: ['进行中', 'run'], succeeded: ['成功', 'ok'], failed: ['失败', 'err'] };   // 状态 → [文字, 标签样式]
const STEP_ICON = { done: '✓', running: '…', failed: '✕', skipped: '–', waiting: '' };
const STEP_TEXT = { done: '完成', running: '进行中', failed: '失败', skipped: '跳过', waiting: '等待' };
const MAX_MB = 50, PAGE_SIZE = 20;

// ================= 上传表单（交互设计 2.1） =================
// file：选中的文件；nameEdited：用户是否手动改过名称（改过就不再自动填）；succeededNames：已成功导入的文件名，用于提示覆盖
let file = null, nameEdited = false, submitting = false, succeededNames = new Set();
const currentType = () => document.querySelector('input[name=t]:checked').value;
const needName = t => t === 'lecture' || t === 'project_doc';
const extOf = n => (n.match(/\.[^.]+$/) || [''])[0].toLowerCase();

/** 根据当前资料类型和文件刷新表单：名称输入框、格式提示、错误信息、覆盖提示、提交按钮是否可用。 */
function refreshForm() {
  const t = currentType();
  document.querySelectorAll('.type-opt').forEach(el => el.classList.toggle('sel', el.querySelector('input').checked));
  $('nameField').hidden = !needName(t);
  $('nameLabel').textContent = t === 'project_doc' ? '项目名' : '课程名';
  $('formatHint').textContent = `支持 ${ALLOWED[t].join(' / ')}，单个文件不超过 ${MAX_MB} MB` + (ALLOWED[t].includes('.zip') ? '；带图片的 md 请与图片一起打包成 zip' : '');
  $('fileInput').accept = ALLOWED[t].join(',');
  const fileErr = file ? validateFile(file, t) : '';
  $('fileErr').hidden = !fileErr; $('fileErr').textContent = fileErr;
  $('submit').disabled = submitting || !file || !!fileErr || (needName(t) && !$('nameInput').value.trim());
  $('overwrite').hidden = !(file && succeededNames.has(file.name));
}
/** 前端文件校验，返回错误信息（空字符串表示通过）。 */
function validateFile(f, t) {
  if (!ALLOWED[t].includes(extOf(f.name))) return `不支持的格式，${TYPE_NAME[t]}仅支持 ${ALLOWED[t].join(' / ')}`;
  if (f.size > MAX_MB * 1024 * 1024) return `文件超过 ${MAX_MB} MB`;
  if (f.size === 0) return '文件内容为空';
  return '';
}
/** 调用接口 A1，用文件名生成默认课程名 / 项目名；用户手动改过名称时不覆盖。 */
async function fillSuggest() {
  const t = currentType();
  if (!file || !needName(t) || nameEdited) return refreshForm();
  try {
    const d = await api(`/imports/suggest?filename=${encodeURIComponent(file.name)}&doc_type=${t}`);
    // 请求返回前用户可能已经开始输入，再检查一次
    if (!nameEdited) $('nameInput').value = (t === 'lecture' ? d.course_name : d.project_name) || '';
  } catch (e) { /* A1 失败时留空，不报错 */ }
  refreshForm();
}
/** 选中文件：显示文件信息并自动填写名称。 */
function chooseFile(f) {
  file = f; nameEdited = false; $('nameInput').value = '';
  $('chosenName').textContent = f.name;
  $('chosenSize').textContent = (f.size / 1024 / 1024).toFixed(1) + ' MB';
  $('chosen').hidden = false; $('drop').hidden = true;
  fillSuggest();
}
// 点击上传区打开文件选择框；选完清空 value，保证再次选择同一文件也能触发 change
$('drop').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => { if (e.target.files[0]) chooseFile(e.target.files[0]); e.target.value = ''; });
// 拖拽上传：阻止浏览器默认打开文件的行为，并切换高亮样式
['dragenter', 'dragover'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('drag'); }));
$('drop').addEventListener('drop', e => {
  const fs = e.dataTransfer.files;
  if (!fs.length) return;
  if (fs.length > 1) toast('一次只能上传一个文件，已取第一个');
  chooseFile(fs[0]);
});
$('clearFile').addEventListener('click', () => { file = null; nameEdited = false; $('nameInput').value = ''; $('chosen').hidden = true; $('drop').hidden = false; refreshForm(); });
$('types').addEventListener('change', fillSuggest);
$('nameInput').addEventListener('input', () => { nameEdited = true; $('nameErr').hidden = true; refreshForm(); });

// 提交：成功后清空表单、显示该任务进度并刷新记录；失败时把错误显示在对应字段下
$('submit').addEventListener('click', async () => {
  const t = currentType();
  const fd = new FormData();
  fd.append('file', file); fd.append('doc_type', t);
  if (t === 'lecture') fd.append('course_name', $('nameInput').value.trim());
  if (t === 'project_doc') fd.append('project_name', $('nameInput').value.trim());
  submitting = true; $('submit').textContent = '提交中…'; refreshForm();
  try {
    const d = await api('/imports', { method: 'POST', body: fd });
    toast(d.is_overwrite ? '已提交，将覆盖旧数据' : '已提交导入任务');
    $('clearFile').click();
    showTask(d.task_id);
    loadHistory();
  } catch (e) {
    // 40001 格式不支持、40004 文件过大 → 文件下方；40002 缺少名称 → 名称下方；其他用提示
    if ([40001, 40004].includes(e.code)) { $('fileErr').textContent = e.message; $('fileErr').hidden = false; }
    else if (e.code === 40002) { $('nameErr').textContent = e.message; $('nameErr').hidden = false; }
    else toast(e.message, true);
  } finally {
    submitting = false; $('submit').textContent = '开始导入'; refreshForm();
  }
});

// ================= 导入进度（交互设计 2.2） =================
// 进行中的任务每 2 秒轮询一次；连续失败 3 次后停止并提供「重新获取」按钮
let currentTaskId = null, pollTimer = null, pollFails = 0;
function stopPolling() { clearTimeout(pollTimer); pollTimer = null; }
/** 在右侧显示指定任务并开始轮询。 */
async function showTask(taskId) {
  stopPolling(); currentTaskId = taskId; pollFails = 0;
  highlightRow();
  await pollOnce();
}
/** 查询一次任务详情；任务未结束时 2 秒后再查。 */
async function pollOnce() {
  const id = currentTaskId;
  try {
    const t = await api(`/imports/${id}`);
    // 请求期间用户切换到了其他任务，丢弃这次结果
    if (id !== currentTaskId) return;
    pollFails = 0;
    renderTask(t);
    if (t.status === 'pending' || t.status === 'running') pollTimer = setTimeout(pollOnce, 2000);
    // 任务刚结束而记录表中还显示进行中，刷新记录表
    else if (historyHas(id, ['pending', 'running'])) loadHistory();
  } catch (e) {
    if (id !== currentTaskId) return;
    if (++pollFails >= 3) {
      $('tResult').innerHTML = `<div class="result fail">无法获取进度（${esc(e.message)}）<button class="btn" style="margin-left:8px" onclick="showTask('${id}')">重新获取</button></div>`;
    } else pollTimer = setTimeout(pollOnce, 2000);
  }
}
/** 渲染任务详情：标题、状态、各步骤（含进度条和错误）、最终结果。 */
function renderTask(t) {
  $('taskEmpty').hidden = true; $('taskBody').hidden = false;
  $('tName').textContent = t.file_name;
  const [txt, cls] = STATUS[t.status]; $('tStatus').textContent = txt; $('tStatus').className = 'tag ' + cls;
  const owner = t.course_name || t.project_name;
  $('tMeta').textContent = `${TYPE_NAME[t.doc_type]}${owner ? ' · ' + owner : ''} · 提交于 ${fmtTime(t.created_at)}${t.is_overwrite ? ' · 覆盖导入' : ''}`;
  $('steps').innerHTML = t.steps.map(s => {
    // 进度单位：转换按页、图片按张、其余按条
    const p = s.progress, unit = s.key === 'convert' ? '页' : s.key === 'images' ? '张' : '条';
    return `<li class="step"><span class="icon ${s.status}">${STEP_ICON[s.status]}</span>
      <div>${esc(s.name)} <span class="sub">${STEP_TEXT[s.status]}</span>
        ${p && p.total ? `<div class="sub">${p.current} / ${p.total} ${unit}</div><div class="bar"><i style="width:${Math.round(p.current / p.total * 100)}%"></i></div>` : ''}
        ${s.error ? `<div class="err">${esc(s.error)}</div>` : ''}</div>
      <span class="dur">${s.status === 'done' ? fmtDuration(s.duration_ms) : ''}</span></li>`;
  }).join('');
  const st = t.stats || {};
  const imgNote = st.image_count ? `；图片 ${st.image_count} 张${st.image_failed ? `（${st.image_failed} 张摘要失败）` : ''}${st.image_missing ? `，缺失 ${st.image_missing} 张` : ''}` : '';
  $('tResult').innerHTML = t.status === 'succeeded'
    ? `<div class="result ok">✓ 导入完成，共生成 ${st.chunk_count} 条知识${imgNote}，已可在问答中检索</div>`
    : t.status === 'failed'
      ? `<div class="result fail">✕ 导入失败：${esc(t.error)}<br><small>其他任务和问答服务不受影响，修正后可重新上传</small></div>` : '';
}

// ================= 导入记录（交互设计 2.3） =================
// 注意：变量不能命名为 history，否则会遮蔽浏览器的 window.history
let filter = '', page = 1, historyItems = [], historyTimer = null;
function historyHas(id, statuses) { return historyItems.some(h => h.task_id === id && statuses.includes(h.status)); }
/** 加载当前页的导入记录；列表中有进行中的任务时每 5 秒自动刷新。 */
async function loadHistory() {
  clearTimeout(historyTimer);
  try {
    const d = await api(`/imports?page=${page}&page_size=${PAGE_SIZE}${filter ? '&status=' + filter : ''}`);
    historyItems = d.items;
    const pages = Math.max(1, Math.ceil(d.total / PAGE_SIZE));
    $('pageInfo').textContent = `共 ${d.total} 条 · ${page} / ${pages}`;
    $('prev').disabled = page <= 1; $('next').disabled = page >= pages;
    $('historyItems').innerHTML = historyItems.length ? historyItems.map(h => {
      const [txt, cls] = STATUS[h.status];
      return `<tr class="clickable" data-id="${h.task_id}"><td class="fn" title="${esc(h.file_name)}">${esc(h.file_name)}</td><td>${TYPE_NAME[h.doc_type]}</td>
        <td>${esc(h.course_name || h.project_name || '—')}</td><td><span class="tag ${cls}">${txt}</span></td>
        <td>${h.stats.chunk_count ?? '—'}</td><td>${fmtTime(h.created_at)}</td><td>${fmtDuration(h.duration_ms)}</td></tr>`;
    }).join('') : '<tr><td colspan="7" class="muted" style="text-align:center">暂无导入记录</td></tr>';
    highlightRow();
    if (historyItems.some(h => h.status === 'pending' || h.status === 'running')) historyTimer = setTimeout(loadHistory, 5000);
  } catch (e) {
    $('historyItems').innerHTML = `<tr><td colspan="7" class="muted" style="text-align:center">无法连接服务 <button class="btn" onclick="loadHistory()">重试</button></td></tr>`;
  }
}
/** 取已成功导入的文件名，选择同名文件时提示将覆盖。 */
async function loadSucceededNames() {
  try { succeededNames = new Set((await api('/imports?page_size=100&status=succeeded')).items.map(x => x.file_name)); } catch (e) { /* 忽略 */ }
  refreshForm();
}
/** 在记录表中高亮右侧正在显示的任务。 */
function highlightRow() { document.querySelectorAll('#historyItems tr').forEach(tr => tr.classList.toggle('on', tr.dataset.id === currentTaskId)); }
// 事件委托：点击任意一行显示该任务
$('historyItems').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) showTask(tr.dataset.id); });
$('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
  filter = b.dataset.f; page = 1; loadHistory();
});
$('prev').addEventListener('click', () => { page--; loadHistory(); });
$('next').addEventListener('click', () => { page++; loadHistory(); });

// 进入页面：加载记录；如有进行中的任务，自动显示最近一个并继续轮询（交互决策 I3）
(async () => {
  refreshForm();
  loadSucceededNames();
  await loadHistory();
  try {
    const active = await api('/imports?page_size=1&status=pending,running');
    if (active.items.length) showTask(active.items[0].task_id);
  } catch (e) { /* 忽略 */ }
})();
</script>
</body>
</html>
